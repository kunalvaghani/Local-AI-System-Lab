[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-systems-lab"
version = "0.11.0"
description = "Inspectable, stage-gated local AI runtime"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kunal Vaghani" }]
dependencies = []

[project.scripts]
local-ai-lab = "runtime.cli:main"
local-ai-infer = "runtime.inference_cli:main"
local-ai-agents = "runtime.agent_cli:main"
local-ai-tools = "runtime.tool_cli:main"
local-ai-scheduler = "runtime.scheduler_cli:main"
local-ai-hardware = "runtime.hardware_cli:main"
local-ai-adaptive = "runtime.adaptive_cli:main"
local-ai-routing = "runtime.routing_cli:main"
local-ai-recovery = "runtime.recovery_cli:main"
local-ai-trace = "runtime.trace_cli:main"

[tool.setuptools.packages.find]
include = ["runtime*"]
